<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shubham Thakur</title>
  <meta name="description" content="Shubham Thakur — valuations, industry reports and market views.">
  <style>
    :root {
      --bg: #0f1419;
      --text: #e8e6e3;
      --muted: #9aa3ad;
      --accent: #c9a961;
      --line: #2a323b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    main { max-width: 560px; width: 100%; }
    .rule { width: 48px; height: 2px; background: var(--accent); margin-bottom: 2rem; }
    h1 {
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      font-weight: normal;
      letter-spacing: -0.01em;
      line-height: 1.1;
      margin-bottom: 1rem;
    }
    .tagline {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2.5rem;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .contact {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      border-top: 1px solid var(--line);
      padding-top: 1.5rem;
      font-size: 0.95rem;
      color: var(--muted);
    }
    a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--accent); }
    a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="rule"></div>
    <h1>Shubham Thakur</h1>
    <div class="tagline">Valuations &middot; Industry Reports &middot; Market Views</div>
    <p>This site is being built. Company valuations, industry reports and market commentary will be published here soon.</p>
    <div class="contact">
      Get in touch: <a href="mailto:connect@shubhamthakur.pro">connect@shubhamthakur.pro</a>
    </div>
  </main>
</body>
</html>
